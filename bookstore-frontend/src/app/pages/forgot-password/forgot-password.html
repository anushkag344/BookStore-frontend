<div class="forgot-wrapper">

  <header class="header-bar">
    <div class="logo-container" routerLink="/login">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span class="logo-text">Bookstore</span>
    </div>
  </header>


  <main class="content-container">
    <div class="forgot-card">
      <h2 class="card-title">Forgot Your Password?</h2>
      <p class="card-description">
        Enter your email address and we'll send you a link to reset your password.
      </p>

      <form (ngSubmit)="onResetPassword()" class="forgot-form">
        <div class="form-group">
          <label for="forgot-email" class="field-label">Email Id</label>
          <input
            type="email"
            id="forgot-email"
            name="email"
            [(ngModel)]="email"
            class="form-control"
            required
          />
        </div>

        <div *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess" class="alert-msg">
          {{ message }}
        </div>

        <button type="submit" class="btn-reset" [disabled]="isLoading">
          <span *ngIf="!isLoading">Reset Password</span>
          <span *ngIf="isLoading">Sending Request...</span>
        </button>
      </form>

      <div class="create-account-container">
        <a routerLink="/signup" class="create-account-btn">CREATE ACCOUNT</a>
      </div>
    </div>
  </main>
</div>
