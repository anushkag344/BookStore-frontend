<div class="login-wrapper">
  <!-- Toast Notification Popup -->
  <div class="toast-popup" [class.show]="showToast" [class.success]="toastType === 'success'" [class.error]="toastType === 'error'">
    <div class="toast-content">
      <div class="toast-icon" *ngIf="toastType === 'success'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <div class="toast-icon" *ngIf="toastType === 'error'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      <span class="toast-text">{{ toastMessage }}</span>
    </div>
    <button type="button" class="toast-close" (click)="showToast = false">&times;</button>
  </div>

  <div class="login-card">

    <div class="illustration-section">
      <div class="illustration-circle">
        <img src="book-shopping.png" alt="Online Book Shopping" class="illustration-img" />
      </div>
      <div class="illustration-title">ONLINE BOOK SHOPPING</div>
    </div>


    <div class="form-section">

      <div class="tabs-header">
        <button
          type="button"
          class="tab-btn"
          [class.active]="activeTab === 'login'"
          (click)="selectTab('login')">
          LOGIN
          <span class="active-indicator" *ngIf="activeTab === 'login'"></span>
        </button>
        <button
          type="button"
          class="tab-btn"
          [class.active]="activeTab === 'signup'"
          (click)="selectTab('signup')">
          SIGNUP
          <span class="active-indicator" *ngIf="activeTab === 'signup'"></span>
        </button>
      </div>

      <!-- Login Form -->
      <form *ngIf="activeTab === 'login'" (ngSubmit)="onLogin()" class="auth-form" autocomplete="off">
        <div class="form-group">
          <label for="email" class="field-label">Email Id</label>
          <input
            type="email"
            id="email"
            name="loginEmail"
            [(ngModel)]="loginEmail"
            class="form-control"
            placeholder="example@gmail.com"
            autocomplete="off"
            required
          />
        </div>

        <div class="form-group password-group">
          <label for="password" class="field-label">Password</label>
          <div class="password-input-container">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="loginPassword"
              [(ngModel)]="loginPassword"
              class="form-control"
              required
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="togglePasswordVisibility()"
              [title]="showPassword ? 'Hide Password' : 'Show Password'"
              aria-label="Toggle Password Visibility">
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#878787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#878787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div class="forgot-password-row">
            <a routerLink="/forgot-password" class="forgot-password-link">Forgot Password?</a>
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert-message error">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="alert-message success">{{ successMessage }}</div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading">Logging in...</span>
        </button>

        <div class="or-divider">
          <span class="or-line"></span>
          <span class="or-text">OR</span>
          <span class="or-line"></span>
        </div>

        <div class="social-buttons">
          <button type="button" class="btn-social btn-google">Google</button>
        </div>
      </form>

      <!-- Signup Form -->
      <form *ngIf="activeTab === 'signup'" (ngSubmit)="onSignup()" class="auth-form">
        <div class="form-group">
          <label for="fullname" class="field-label">Full Name</label>
          <input
            type="text"
            id="fullname"
            name="signupFullName"
            [(ngModel)]="signupFullName"
            class="form-control"
            required
          />
        </div>

        <div class="form-group">
          <label for="signup-email" class="field-label">Email Id</label>
          <input
            type="email"
            id="signup-email"
            name="signupEmail"
            [(ngModel)]="signupEmail"
            class="form-control"
            required
          />
        </div>

        <div class="form-group">
          <label for="signup-password" class="field-label">Password</label>
          <div class="password-input-container">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="signup-password"
              name="signupPassword"
              [(ngModel)]="signupPassword"
              class="form-control"
              required
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="togglePasswordVisibility()"
              [title]="showPassword ? 'Hide Password' : 'Show Password'"
              aria-label="Toggle Password Visibility">
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#878787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#878787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="mobile" class="field-label">Mobile Number</label>
          <input
            type="tel"
            id="mobile"
            name="signupMobile"
            [(ngModel)]="signupMobile"
            class="form-control"
            required
          />
        </div>

        <div *ngIf="errorMessage" class="alert-message error">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="alert-message success">{{ successMessage }}</div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Signup</span>
          <span *ngIf="isLoading">Signing up...</span>
        </button>
      </form>

    </div>
  </div>
</div>
