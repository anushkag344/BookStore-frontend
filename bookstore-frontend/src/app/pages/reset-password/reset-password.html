<div class="reset-wrapper">
  <header class="header-bar">
    <div class="logo-container" routerLink="/login">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span class="logo-text">Bookstore</span>
    </div>
  </header>

  <main class="content-container">
    <div class="reset-card">
      <h2 class="card-title">Reset Your Password</h2>
      <p class="card-description">
        Enter your reset token and new password below to reset your account password.
      </p>

      <form (ngSubmit)="onSubmit()" class="reset-form">
        <div class="form-group">
          <label for="reset-token" class="field-label">Reset Token</label>
          <input
            type="text"
            id="reset-token"
            name="token"
            [(ngModel)]="token"
            class="form-control"
            placeholder="Enter token received via email"
            required
          />
        </div>

        <div class="form-group">
          <label for="new-password" class="field-label">New Password</label>
          <div class="password-input-container">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="new-password"
              name="newPassword"
              [(ngModel)]="newPassword"
              class="form-control"
              placeholder="Enter new password"
              required
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="togglePasswordVisibility()"
              [title]="showPassword ? 'Hide Password' : 'Show Password'"
              aria-label="Toggle Password Visibility">
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#878787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#878787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password" class="field-label">Confirm Password</label>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="confirm-password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            class="form-control"
            placeholder="Confirm new password"
          />
        </div>

        <div *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess" class="alert-msg">
          {{ message }}
        </div>

        <button type="submit" class="btn-reset" [disabled]="isLoading">
          <span *ngIf="!isLoading">Submit New Password</span>
          <span *ngIf="isLoading">Resetting...</span>
        </button>
      </form>

      <div class="login-link-container">
        <a routerLink="/login" class="login-link">Back to Login</a>
      </div>
    </div>
  </main>
</div>
